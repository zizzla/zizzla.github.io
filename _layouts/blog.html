---
layout: base
---

<section class="min-h-screen bg-navy py-16 sm:py-20">
  <div class="mx-auto max-w-9xl px-6">
    <header class="max-w-2xl">
      <h1 class="text-4xl font-bold text-white sm:text-5xl">{{ page.title }}</h1>
      {%- if page.description %}
      <p class="mt-4 text-base leading-7 text-white/60">{{ page.description }}</p>
      {%- endif %}
    </header>

    {%- if content != "" %}
    <div class="mt-6 max-w-2xl text-white/70">{{ content }}</div>
    {%- endif %}

    {%- if site.posts.size > 0 -%}
    <div class="mt-10 grid gap-4 md:grid-cols-2 lg:grid-cols-3">
      {%- assign posts = site.posts -%}
      {%- include post-items.html posts = posts -%}
    </div>
    {%- endif -%}
  </div>
</section>
