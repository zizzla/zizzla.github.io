<nav x-data="{ mobileMenuIsOpen: false }"
     @keydown.escape.window="mobileMenuIsOpen = false"
     @resize.window="if (window.innerWidth >= 768) mobileMenuIsOpen = false"
     x-effect="document.documentElement.classList.toggle('mobile-menu-open', mobileMenuIsOpen)"
     class="fixed top-0 left-0 w-full h-20 border-b border-white/5 bg-navy md:bg-navy/40 md:backdrop-blur-md z-40">

    <div class="max-w-screen-2xl mx-auto px-6 flex justify-between items-center h-full">
        <a href="{{ '/' | relative_url }}" class="flex items-center gap-3">
            <img src="{{ site.logo | relative_url }}" alt="Zizzla Logo" class="h-10 w-auto">
            <span class="font-black text-2xl tracking-tighter text-white">
                Zizzla
            </span>
        </a>

        <div class="flex items-center gap-10">
            <ul class="hidden md:flex items-center gap-10 text-sm font-black uppercase tracking-widest text-white/80">
                {%- include nav-items-desktop.html paths = page_paths %}
                <!-- <li>
                    <a href="https://app.zizzla.com/login" class="text-white hover:text-spring transition-colors">
                        Log in
                    </a>
                </li> -->
            </ul>

            <button @click="mobileMenuIsOpen = !mobileMenuIsOpen"
                    :class="mobileMenuIsOpen ? 'fixed top-6 right-6 z-50' : 'relative z-50'"
                    type="button"
                    class="flex text-white md:hidden p-2 hover:bg-white/10 rounded-lg transition-colors"
                    :aria-expanded="mobileMenuIsOpen" aria-controls="mobile-navigation"
                    :aria-label="mobileMenuIsOpen ? 'Stäng menyn' : 'Öppna menyn'">
                <svg x-show="!mobileMenuIsOpen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="size-7">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                </svg>
                <svg x-show="mobileMenuIsOpen" x-cloak xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="size-7">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
            </button>
    </div>
  </div>

  <div id="mobile-navigation" x-cloak
       x-show="mobileMenuIsOpen"
       @click.outside="mobileMenuIsOpen = false"
       @click="if ($event.target.closest('a')) mobileMenuIsOpen = false"
       class="absolute top-full left-0 z-40 max-h-[calc(100dvh-5rem)] w-full overflow-y-auto border-b border-white/10 bg-navy shadow-xl md:hidden">

      <div class="flex flex-col items-center px-6 py-4">
          <ul class="flex flex-col items-center gap-2 text-2xl font-black uppercase tracking-[0.2em] text-white">
              {%- include nav-items.html paths = page_paths %}
          </ul>

          <!-- <div class="pt-10 border-t border-white/10 w-2/3 flex justify-center">
              <a href="https://app.zizzla.com/login" class="text-spring font-black uppercase tracking-widest text-lg">
                  Log in
              </a>
          </div> -->
      </div>
  </div>

</nav>
